name: Build and Push Docker Images

on:
  push:
    branches:
      - main

jobs:
  build-and-push:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build Frontend Image
      run: |
        docker build -t frontend-image ./frontend

    - name: Build Backend Image
      run: |
        docker build -t backend-image ./backend

    - name: Tag Frontend Image
      run: |
        docker tag frontend-image:latest \
        924982554051.dkr.ecr.ap-south-1.amazonaws.com/frontend-repo:${{ github.sha }}

    - name: Tag Backend Image
      run: |
        docker tag backend-image:latest \
        924982554051.dkr.ecr.ap-south-1.amazonaws.com/backend-repo:${{ github.sha }}

    - name: Push Frontend Image
      run: |
        docker push \
        924982554051.dkr.ecr.ap-south-1.amazonaws.com/frontend-repo:${{ github.sha }}

    - name: Push Backend Image
      run: |
        docker push \
        924982554051.dkr.ecr.ap-south-1.amazonaws.com/backend-repo:${{ github.sha }}
